name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install bash 5 and shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install bash shellcheck
      - name: Install zsh (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: shellcheck
        run: shellcheck -s bash -x bash/*.bash lib/kb.sh bin/* install.sh test/smoke.sh
      - name: smoke test
        run: bash test/smoke.sh
