name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install bash 5 and shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install bash shellcheck
      - name: shellcheck
        run: shellcheck -s bash -x bash/*.bash install.sh test/smoke.sh
      - name: smoke test
        run: bash test/smoke.sh
